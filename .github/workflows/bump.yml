# winget 清单跟版器（手动触发）
#
# 为什么改手动（2026-11-25）：#20 那次跑红了 —— PR 已经开出来，但写 fork master 那段挂了，
# 结果是「有 PR 产出 + job 全红」，看着很迷惑（脚本里两段流程互相独立，见 README）。
# 跟版本来就不是高频动作（VS Code 一周一版），与其让它自己红，不如想跑时点一下。
#
# 它不克隆 winget-pkgs（78 万个文件、近 1GB），全部走 API：
#   读版本表 → 取基底清单 → 生成新版本 → blobs/trees/commits 写进 fork 的 master → 向上游开 PR
#
# 需要 secret：GH_TOKEN —— classic PAT，勾 public_repo
#   （fine-grained 不行：不能向「你不是成员的公共仓库」提交内容）
# 手动触发：Actions → bump winget manifests → Run workflow

name: bump winget manifests

on:
  workflow_dispatch:

permissions:
  contents: read            # 只读本仓库（脚本在里面）；写 fork 一律用 GH_TOKEN

concurrency:
  group: bump-winget
  cancel-in-progress: false

jobs:
  bump:
    runs-on: windows-latest  # 需要 winget validate，别改成 ubuntu
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      FORK: zhou-dev-design/winget-pkgs

    steps:
      - uses: actions/checkout@v4

      - name: 检查凭据
        shell: pwsh
        run: |
          if (-not $env:GH_TOKEN) {
            throw '缺少 GH_TOKEN secret：Settings → Secrets and variables → Actions 里加一个 classic PAT（勾 public_repo）'
          }
          Write-Host "GH_TOKEN 已配置（长度 $($env:GH_TOKEN.Length)）"

      # -ClaAgree：开完 PR 自动评论一句 CLA 同意，并给历史遗留还挂着 Needs-CLA 的 PR 补上。
      # 不评论标签不会掉，PR 永远合不进去（签过一次不免，每个新 PR 都要说一次）。
      - name: 探测新版本 → 生成清单 → 写进 fork → 开 PR → 补 CLA
        shell: pwsh
        run: |
          $wd = Join-Path $env:RUNNER_TEMP 'winget-work'
          New-Item -ItemType Directory -Force -Path $wd | Out-Null
          ./bump-winget.ps1 -RepoRoot $wd -WorkDir $wd -Fork $env:FORK -ApiCommit -OpenPr -ClaAgree

      - name: 汇总
        if: always()
        shell: pwsh
        run: |
          $wd = Join-Path $env:RUNNER_TEMP 'winget-work'
          if (-not (Test-Path $wd)) { Write-Host '本轮没有生成任何文件'; exit 0 }
          $files = @(Get-ChildItem -Recurse -File $wd)
          Write-Host "本轮生成 $($files.Count) 个文件"
          $files | Select-Object -First 12 | ForEach-Object { Write-Host "  $($_.FullName.Substring($wd.Length))" }
