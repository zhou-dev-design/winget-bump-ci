# 哨兵：验证本仓库的 schedule 到底会不会触发
# 最小成本（不 checkout、只 echo），跑一次约 5 秒。
#
# 实测结论（2026-11-19）：建库后 2 小时 40 分内，bump 12 个槽 + sync 3 个槽
# + 本探测的 */5 两个槽全部为 0 → 本账号的 schedule 根本没被调度器收进去。
# 真正干活改由外部轮询器触发（见 poller/），这里降为每小时一次的哨兵：
# 哪天它开始有 schedule 运行记录了，说明调度器恢复，可以再考虑用回原生 cron。
name: schedule probe

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 时间戳
        run: |
          echo "probe ok"
          date -u
